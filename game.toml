[game]
name = "Blinx: The Time Sweeper"
region = "NTSC-U"
title_id = "4D530013"
xbe_sha256 = "e6b7cd8a5527dd001e05bb3e881d9b24ffc58824ff67def394215ddbc8009249"

[framework]
repository = "https://github.com/mstan/xboxllr"
revision = "961ac17fd1dc8460ab78713242d9854c6a6054fd"
directory = "xboxlle"

[launcher]
ui_revision = "ccc186e097b362555292b157ffd303abcea26fbf"
# Modes become selectable only after shared and title-specific qualification.
frame_modes = ["interpolated"]

[launcher.defaults."blinx.enhancement.widescreen/widescreen"]
enabled = true
options = { aspect = "adaptive" }

[launcher.defaults."xboxlle.enhancement.visuals/resolution"]
enabled = true
options = { height = "1080" }

[launcher.defaults."xboxlle.enhancement.visuals/antialiasing"]
enabled = true
options = { method = "fxaa" }

[launcher.defaults."xboxlle.enhancement.visuals/supersampling"]
enabled = true
options = { axis = "2" }

[launcher.defaults."xboxlle.enhancement.visuals/filtering"]
enabled = true
options = { anisotropy = "8" }

[launcher.defaults."xboxlle.enhancement.frame-rate/frame-rate"]
enabled = true
options = { mode = "interpolated", rate = "60" }

[launcher.defaults."xboxllr.diagnostics/session-replay"]
enabled = true

[mods]
# Trusted gameplay cheats compiled into src/mods/widescreen.c (docs/CHEATS.md).
switches = [
  { manifest = "mods/preloaded/packages/blinx.enhancement.cheats/1.0.0/manifest.toml", package = "blinx.enhancement.cheats", feature = "no-time-limit", key = "NO_TIME_LIMIT" },
  { manifest = "mods/preloaded/packages/blinx.enhancement.cheats/1.0.0/manifest.toml", package = "blinx.enhancement.cheats", feature = "more-stock", key = "MORE_STOCK" },
  { manifest = "mods/preloaded/packages/blinx.enhancement.cheats/1.0.0/manifest.toml", package = "blinx.enhancement.cheats", feature = "infinite-time-controls", key = "INFINITE_TIME_CONTROLS" },
]

[generation]
donor_revision = "63f18f0334fbd8c00313c4bb565accf00627a4fd"
data_sections = "MDL*,MAP[0-9]*"
bindings = ["media", "cache", "d3d", "jump", "cpu", "input", "audio", "title"]
poll_waits = "poll-waits.json"

[build]
PILOT_NATIVE_OPTIMIZATION = "OPTIMIZED"
PILOT_MEDIA = "INSTALLED"
PILOT_CACHE = "NATIVE"
PILOT_CPU_PROBE = "NATIVE"
PILOT_RENDERER = "D3D11"
PILOT_D3D_DONOR = "PHOBOS"
PILOT_AUDIO = "NATIVE"
PILOT_AUDIO_BACKEND = "XAUDIO2_DSP"
PILOT_CALENDAR = "LLE"
PILOT_IO_DEVICE = "LLE"
PILOT_USB = "OFF"
PILOT_DISPLAY = "NATIVE"
PILOT_MEMORY = "NATIVE"
PILOT_FILES = "NATIVE"

[modes.attract]
PILOT_INPUT = "NATIVE"

# Fast native gameplay, independently selected from the retained LLE modes.
[modes.play]
PILOT_NATIVE_IPO = "ON"
PILOT_NATIVE_POLL_WAIT = "ON"
PILOT_INPUT = "NATIVE"
PILOT_SCHEDULING = "NATIVE"
PILOT_CALENDAR = "HLE"
PILOT_IO_DEVICE = "OFF"
PILOT_USB = "OFF"

[modes.input-lle]
PILOT_INPUT = "ORIGINAL"
PILOT_USB = "LLE"

[modes.display-lle]
PILOT_INPUT = "NATIVE"
PILOT_USB = "LLE"
PILOT_DISPLAY = "LLE"

[modes.input-display-lle]
PILOT_INPUT = "ORIGINAL"
PILOT_USB = "LLE"
PILOT_DISPLAY = "LLE"

[modes.memory-lle]
PILOT_INPUT = "NATIVE"
PILOT_USB = "LLE"
PILOT_MEMORY = "LLE"

[modes.files-lle]
PILOT_INPUT = "NATIVE"
PILOT_USB = "LLE"
PILOT_MEMORY = "LLE"
PILOT_FILES = "LLE"
PILOT_CACHE = "ORIGINAL"
PILOT_FILES_TITLE_ROOT = '\Device\Harddisk0\Partition1\Titles\4D530013'

[runtime]
XLLE_PILOT_RAM_CACHE = "1"
XLLE_PILOT_GUEST_SCHEDULER = "1"
XLLE_PILOT_DEFER_STREAM_UPLOAD = "1"
XLLE_PILOT_TEXTURE_EXPOSURE_CACHE = "1"
XLLE_PILOT_GPU_EVENTS = "1"
XLLE_PILOT_EVENT_TRACE = "0"
XLLE_PILOT_TRACE = "0"
