format_version = 1
id = "blinx.enhancement.cheats"
version = "1.0.0"
name = "Blinx Cheats"
category = "Gameplay"
description = "Optional gameplay cheats. Settings apply when the game starts. Hearts are never changed."
save_compatibility = "shared"

[[target]]
game_id = "4D530013"
xbe_sha256 = "e6b7cd8a5527dd001e05bb3e881d9b24ffc58824ff67def394215ddbc8009249"

[[feature]]
id = "no-time-limit"
name = "No stage time limit"
description = "Stages never fail at 10:00 and the final 30-second countdown warning never appears. The elapsed timer and Results keep your real time."
default_enabled = false

[[feature]]
id = "more-stock"
name = "More time-control stock"
description = "Hold up to 20 time controls: the game's 10 slots plus a 10-control reserve that refills slots as you use them. Icon counts include the reserve (up to 10 each). The reserve lasts until you close the game."
default_enabled = false

[[feature]]
id = "infinite-time-controls"
name = "Infinite time controls"
description = "Always hold one of each time control; using one never uses it up. Only heart crystals appear, except in the final boss."
default_enabled = false
